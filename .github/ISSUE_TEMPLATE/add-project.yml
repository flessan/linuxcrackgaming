name: Suggest a project
description: Suggest an open-source Linux game, rewrite, native port, launcher, runtime or compatibility tool.
title: "[Project submission]: "
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below and submit. GitHub Actions will automatically prepare a draft pull request with the README catalogue entry. A maintainer checks it before anything is merged.
  - type: input
    id: project-name
    attributes:
      label: Project name
      placeholder: Example: Heroic Games Launcher
    validations:
      required: true
  - type: input
    id: game-title
    attributes:
      label: Game or software
      placeholder: Example: GOG, Epic Games and Amazon Games
    validations:
      required: true
  - type: input
    id: repository-url
    attributes:
      label: GitHub repository URL
      placeholder: https://github.com/owner/repository
      description: Use the official upstream repository.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Catalogue category
      options:
        - Engine rewrite
        - Launcher or runtime
        - Native recompilation
        - Compatibility tool
        - Open-source game
    validations:
      required: true
  - type: dropdown
    id: package-formats
    attributes:
      label: Available Linux package formats
      multiple: true
      options:
        - Flatpak
        - AppImage
        - Native distribution package
        - Source build only
    validations:
      required: true
  - type: textarea
    id: install-instructions
    attributes:
      label: How can someone install this project on Linux?
      description: Paste the exact Linux install command or official release steps. This is added to the draft PR as a code block, not executed by Actions.
      placeholder: |
        flatpak install flathub org.example.Project
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Game files and other requirements
      description: State whether users need an original game copy, account, firmware, runtime, permissions or other files.
      placeholder: No original game files required, or explain what the user must provide.
    validations:
      required: true
  - type: dropdown
    id: steam-deck
    attributes:
      label: Steam Deck compatibility
      options:
        - Yes, tested or documented
        - No
        - Not tested / not known
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Technology or language
      placeholder: Rust, C++, Python / GTK, etc.
  - type: input
    id: license
    attributes:
      label: License
      placeholder: GPL-3.0, MIT, proprietary, or not stated
  - type: input
    id: website
    attributes:
      label: Official website
      placeholder: https://example.org
  - type: input
    id: image-url
    attributes:
      label: Project screenshot or logo URL
      description: Optional direct HTTPS image URL.
      placeholder: https://example.org/images/project-screenshot.png
  - type: textarea
    id: summary
    attributes:
      label: What does this project do?
      description: Give one concise overview suitable for the README table.
      placeholder: A short, factual summary...
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Supporting sources
      description: Add at least one HTTPS link to official installation docs, releases, source repository or compatibility notes. Actions checks that a secure source link is present.
      placeholder: |
        - https://...
    validations:
      required: true
