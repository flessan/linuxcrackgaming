name: Catalogue issue to PR

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  prepare-approval-label:
    if: github.event.action == 'opened' && !github.event.issue.pull_request && startsWith(github.event.issue.title, '[Project submission]')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure catalogue approval label exists
        uses: actions/github-script@v8
        with:
          script: |
            const labelName = 'catalogue:approved';
            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            if (!labels.some((label) => label.name === labelName)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '2F855A',
                description: 'Maintainer reviewed the submission; create a catalogue PR.'
              });
            }

  create-catalogue-pr:
    if: github.event.action == 'labeled' && github.event.label.name == 'catalogue:approved' && !github.event.issue.pull_request && startsWith(github.event.issue.title, '[Project submission]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert approved issue into README table row
        id: generate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue-to-readme-row.mjs

      - name: Create pull request for review
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: catalogue/issue-${{ github.event.issue.number }}
          base: main
          delete-branch: true
          commit-message: "Add catalogue project from issue #${{ github.event.issue.number }}"
          title: "[Catalogue] Add project from issue #${{ github.event.issue.number }}"
          body: |
            This pull request was generated from issue #${{ github.event.issue.number }} after a maintainer applied the `catalogue:approved` label.

            - Adds a human-readable row to the README catalogue.
            - Adds the submitted project details and installation notes.
            - Runs the README-to-JSON generator and production build for verification.

            Please review the upstream repository, package formats, installation instructions and game-data requirements before merging.
          draft: true

      - name: Dispatch verification for the generated branch
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: catalogue/issue-${{ github.event.issue.number }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'verify.yml',
              ref: 'main',
              inputs: { checkout_ref: process.env.BRANCH_NAME }
            });

      - name: Explain failed conversion
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'The automatic catalogue PR could not be prepared. Please check that the issue includes a valid GitHub repository, a confirmed Linux package format, and installation instructions. A maintainer can correct the submission and apply the approval label again.'
            });
