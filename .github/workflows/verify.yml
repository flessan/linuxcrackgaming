name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch or commit to validate (used by the issue-to-PR workflow)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate catalogue JSON from README
        run: npm run generate:catalogue

      - name: Check issue submission automation syntax
        run: node --check scripts/issue-to-readme-row.mjs

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
